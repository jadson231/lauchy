<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validação MFA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="mfa-container">
    <h2>Autenticação em Dois Fatores (2FA)</h2>
    <p>Insira o código de 6 dígitos do seu aplicativo autenticador.</p>

    <form id="mfa-form">
      <div class="otp-inputs">
        <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="one-time-code" required />
        <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
        <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
        <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
        <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
        <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
      </div>

      <button type="submit" id="btn-verify">Verificar Código</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
